<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Projetos — Controle do Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161c; --ink-2:#1c1f28; --ink-3:#262a36;
    --paper:#f4f3ef; --paper-2:#fbfaf7; --card:#ffffff;
    --line:#e3e1da; --line-2:#d3d0c6;
    --txt:#1a1c22; --txt-2:#5d6068; --txt-3:#8b8d95;
    --accent:#ff5436; --accent-deep:#d83f24;
    --green:#16a06a; --green-bg:#e4f5ec;
    --amber:#d68a04; --amber-bg:#fbf0d8;
    --red:#e0392b; --red-bg:#fbe4e1;
    --violet:#6d4bd1; --violet-bg:#ece6fa;
    --blue:#2f6fd8; --blue-bg:#e3edfb;
    --slate:#5d6068; --slate-bg:#ecebe6;
    --radius:14px; --shadow:0 1px 2px rgba(20,22,28,.05),0 8px 24px -12px rgba(20,22,28,.18);
    --shadow-lg:0 24px 60px -24px rgba(20,22,28,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
  h1,h2,h3,h4{font-family:'Sora',sans-serif;letter-spacing:-.02em;font-weight:700}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#cfccc3;border-radius:6px;border:2px solid var(--paper)}
  .app{display:flex;min-height:100vh}
  .side{width:240px;flex-shrink:0;background:var(--ink);color:#d6d8df;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 20px}
  .brand .dot{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-family:'Sora';font-weight:800;color:#fff;font-size:16px;box-shadow:0 4px 14px -4px var(--accent)}
  .brand b{font-family:'Sora';color:#fff;font-size:15px;font-weight:700;display:block;line-height:1.1}
  .brand span{font-size:11px;color:#7e828e;letter-spacing:.04em;text-transform:uppercase}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
  .nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#a4a7b2;font-weight:500;font-size:13.5px;width:100%;text-align:left;transition:.15s}
  .nav button:hover{background:var(--ink-2);color:#fff}
  .nav button.on{background:var(--ink-3);color:#fff}.nav button.on .ic{color:var(--accent)}
  .nav .ic{width:18px;height:18px;flex-shrink:0}
  .side-foot{margin-top:auto;padding-top:16px;border-top:1px solid #2a2d38;display:flex;flex-direction:column;gap:6px}
  .side-foot button{width:100%;padding:10px;border-radius:9px;background:var(--ink-2);color:#cfd2da;font-weight:600;font-size:12.5px;display:flex;gap:8px;align-items:center;justify-content:center;transition:.15s}
  .side-foot button:hover{background:var(--accent);color:#fff}
  .side-foot .reset{background:transparent;color:#6f727d;font-size:11.5px}
  .side-foot .reset:hover{background:transparent;color:var(--red)}
  .side-foot .acct-info{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;background:transparent;color:#8b8e98;font-size:11.5px;font-weight:600;overflow:hidden;cursor:default}
  .side-foot .acct-info svg{flex-shrink:0;opacity:.75}
  .side-foot .acct-info span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side-foot button.logout{background:transparent;color:#d39990}
  .side-foot button.logout:hover{background:var(--red);color:#fff}
  .side-foot button.invite{background:var(--ink-3);color:#a0d4b4}
  .side-foot button.invite:hover{background:var(--green);color:#fff}
  .myact-add{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .myact-add input[type=text],.myact-add input:not([type]){flex:1;min-width:180px}
  .myact-add input{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;outline:none}
  .myact-add input:focus{border-color:var(--accent)}
  .myact-add input[type=date]{max-width:150px;color:var(--txt-2)}
  .myact-add button{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 15px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .myact-add button:hover{filter:brightness(1.08)}
  .myact-row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .myact-row:last-child{border-bottom:none}
  .myact-chk{position:relative;flex-shrink:0;width:19px;height:19px;cursor:pointer}
  .myact-chk input{position:absolute;opacity:0;width:0;height:0}
  .myact-chk span{display:block;width:19px;height:19px;border:2px solid var(--line);border-radius:6px;transition:.15s}
  .myact-chk input:checked+span{background:var(--green);border-color:var(--green)}
  .myact-chk input:checked+span::after{content:'';position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .myact-ttl{flex:1;font-size:13.5px;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .myact-row.is-done .myact-ttl{text-decoration:line-through;color:var(--txt-2);opacity:.7}
  .myact-due{flex-shrink:0;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(120,120,130,.14);color:var(--txt-2)}
  .myact-due.soon{background:rgba(217,160,30,.16);color:var(--amber)}
  .myact-due.late{background:rgba(214,69,69,.16);color:var(--red)}
  .myact-due.done{background:rgba(120,120,130,.12);color:var(--txt-2)}
  .myact-del{flex-shrink:0;background:transparent;border:none;color:var(--txt-2);font-size:14px;cursor:pointer;padding:4px 7px;border-radius:6px;line-height:1}
  .myact-del:hover{background:var(--red);color:#fff}
  .myact-main{flex:1;min-width:0}
  .myact-main .myact-ttl{flex:none}
  .myact-desc{font-size:11.5px;color:var(--txt-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .myact-ed{flex-shrink:0;background:transparent;border:none;color:var(--txt-2);font-size:13px;cursor:pointer;padding:4px 7px;border-radius:6px;line-height:1}
  .myact-ed:hover{background:var(--accent);color:#fff}
  .atv-add{display:flex;flex-direction:column;gap:9px}
  .atv-add input[type=text],.atv-add textarea{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px 12px;font:inherit;font-size:13.5px;outline:none;width:100%;box-sizing:border-box}
  .atv-add textarea{resize:vertical;min-height:44px;line-height:1.45}
  .atv-add input:focus,.atv-add textarea:focus{border-color:var(--accent)}
  .atv-add-foot,.atv-edit-foot{display:flex;align-items:center;gap:9px}
  .atv-add-foot input[type=date],.atv-edit-foot input[type=date]{background:var(--card);border:1px solid var(--line);color:var(--txt-2);border-radius:9px;padding:8px 11px;font:inherit;font-size:13px;outline:none}
  .sp{flex:1}
  .btn-acc{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:9px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn-acc:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;color:var(--txt-2);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .btn-ghost:hover{background:var(--line)}
  .atv-row{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .atv-row:last-child{border-bottom:none}
  .atv-row .myact-chk{margin-top:1px}
  .atv-main{flex:1;min-width:0}
  .atv-ttl{font-size:14px;font-weight:600;color:var(--txt);word-break:break-word}
  .atv-row.is-done .atv-ttl{text-decoration:line-through;color:var(--txt-2);opacity:.7}
  .atv-desc{font-size:12.5px;color:var(--txt-2);margin-top:3px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .atv-meta{display:flex;align-items:center;gap:9px;margin-top:7px;flex-wrap:wrap}
  .atv-nodate{font-size:11px;color:var(--txt-3);font-weight:500}
  .atv-created{font-size:11px;color:var(--txt-3)}
  .atv-btn{flex-shrink:0;background:transparent;border:1px solid var(--line);color:var(--txt-2);font-size:12px;font-weight:600;cursor:pointer;padding:6px 11px;border-radius:8px;line-height:1;white-space:nowrap}
  .atv-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .atv-row.editing{padding:6px 0}
  .atv-edit{flex:1;display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--accent);border-radius:11px;padding:13px}
  .atv-edit input[type=text],.atv-edit textarea{background:var(--paper-2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;outline:none;width:100%;box-sizing:border-box}
  .atv-edit textarea{resize:vertical;min-height:40px;line-height:1.45}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--line);background:var(--paper-2);position:sticky;top:0;z-index:30}
  .top h1{font-size:21px}.top .sub{color:var(--txt-2);font-size:13px;margin-top:1px}
  .top-right{display:flex;align-items:center;gap:10px}
  .filters{display:flex;gap:8px;align-items:center}
  select.f{padding:8px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--card);font-size:13px;font-weight:500;color:var(--txt-2);cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 12 12'><path d='M3 4.5L6 7.5L9 4.5' stroke='%238b8d95' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 9px center;padding-right:26px}
  .btn-add{padding:9px 16px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 6px 16px -8px var(--accent)}
  .btn-add:hover{background:var(--accent-deep);transform:translateY(-1px)}
  .view{padding:26px 32px 60px;flex:1}
  .hide{display:none!important}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
  .kpi .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
  .kpi .lbl{font-size:11.5px;color:var(--txt-2);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .kpi .num{font-family:'Sora';font-size:32px;font-weight:800;line-height:1;margin-top:10px;letter-spacing:-.03em}
  .kpi .meta{font-size:11.5px;color:var(--txt-3);margin-top:5px}
  .grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel-h{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .panel-h h3{font-size:15px}.panel-h .tag{font-size:11px;color:var(--txt-3);font-weight:600}
  .panel-b{padding:8px 8px}
  .action-row{display:flex;gap:12px;padding:13px 12px;border-radius:10px;transition:.12s;cursor:pointer;align-items:flex-start}
  .action-row:hover{background:var(--paper)}
  .action-row .pin{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
  .action-row .body{flex:1;min-width:0}
  .action-row .pname{font-weight:600;font-size:13.5px;color:var(--txt)}
  .action-row .pact{font-size:12.5px;color:var(--txt-2);margin-top:2px}
  .action-row .who{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;background:var(--ink);color:#fff;padding:2px 9px;border-radius:20px;margin-top:6px}
  .action-row .rt{text-align:right;flex-shrink:0}
  .empty{text-align:center;padding:34px 16px;color:var(--txt-3);font-size:13px}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .badge .d{width:6px;height:6px;border-radius:50%}
  .s-green{background:var(--green-bg);color:#0c7048}.s-green .d{background:var(--green)}
  .s-amber{background:var(--amber-bg);color:#9c6404}.s-amber .d{background:var(--amber)}
  .s-red{background:var(--red-bg);color:#b32418}.s-red .d{background:var(--red)}
  .s-violet{background:var(--violet-bg);color:#5535ad}.s-violet .d{background:var(--violet)}
  .s-blue{background:var(--blue-bg);color:#1f53a8}.s-blue .d{background:var(--blue)}
  .s-slate{background:var(--slate-bg);color:#494c54}.s-slate .d{background:var(--slate)}
  .deadline{font-weight:600;font-size:12.5px}
  .deadline.late{color:var(--red)}.deadline.soon{color:var(--amber)}.deadline.ok{color:var(--txt-2)}
  .dl-sub{font-size:11px;color:var(--txt-3);margin-top:1px}
  .chip-h{font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:6px;display:inline-block}
  .chip-h.ok{background:var(--green-bg);color:#0c7048}.chip-h.bad{background:var(--red-bg);color:#b32418}
  .kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
  .col{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);width:268px;flex-shrink:0}
  .col-h{padding:13px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
  .col-h .ct{display:flex;align-items:center;gap:8px;font-weight:700;font-family:'Sora';font-size:13.5px}
  .col-h .ct .ic{width:8px;height:18px;border-radius:3px}
  .col-h .cnt{font-size:12px;color:var(--txt-3);font-weight:600;background:var(--card);padding:1px 8px;border-radius:20px}
  .col-b{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer;transition:.13s;box-shadow:0 1px 2px rgba(20,22,28,.04)}
  .kcard:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px)}
  .kcard .kt{font-weight:600;font-size:13.5px;line-height:1.3;margin-bottom:8px}
  .kcard .krow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
  .kcard .partner{font-size:11px;color:var(--txt-3);font-weight:500;margin-bottom:6px;display:flex;align-items:center;gap:5px}
  .avatar{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;flex-shrink:0}
  .prog{height:5px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:9px}
  .prog i{display:block;height:100%;border-radius:6px}
  .ktasks{font-size:11px;color:var(--txt-3);font-weight:600;margin-top:6px}
  .tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:11px;font-weight:700;color:var(--txt-3);text-transform:uppercase;letter-spacing:.05em;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--paper-2);white-space:nowrap}
  th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--txt)}
  td{padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr{cursor:pointer;transition:.1s}tbody tr:hover{background:var(--paper)}
  .td-name{font-weight:600;color:var(--txt)}.td-sub{font-size:11.5px;color:var(--txt-3);margin-top:1px}
  .resp-cell{display:flex;align-items:center;gap:8px}
  .gantt{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .gantt-scroll{overflow-x:auto}.gantt-grid{min-width:780px}
  .g-head{display:flex;border-bottom:1px solid var(--line);background:var(--paper-2)}
  .g-head .g-name{width:250px;flex-shrink:0;padding:11px 16px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--txt-3);border-right:1px solid var(--line)}
  .g-weeks{flex:1;display:flex}
  .g-wk{flex:1;min-width:54px;padding:9px 4px;text-align:center;font-size:10.5px;font-weight:600;color:var(--txt-3);border-right:1px solid var(--line)}
  .g-wk.now{background:var(--accent);color:#fff}
  .g-row{display:flex;border-bottom:1px solid var(--line);align-items:center}
  .g-row.task{background:#fcfbf8}.g-row:last-child{border-bottom:none}.g-row:hover{background:var(--paper)}
  .g-name{width:250px;flex-shrink:0;padding:10px 16px;border-right:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .g-name.proj{cursor:pointer}
  .g-toggle{width:16px;flex-shrink:0;display:grid;place-items:center;color:var(--txt-3);font-size:10px}
  .g-name .gt{font-weight:600;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-name .gs{font-size:11px;color:var(--txt-3);margin-top:2px}
  .g-name.tname{padding-left:40px}.g-name.tname .gt{font-weight:500;font-size:12px;color:var(--txt-2)}
  .g-track{flex:1;position:relative;display:flex}
  .g-track.proj{height:48px}.g-track.task{height:34px}
  .g-track .cell{flex:7;border-right:1px solid #f0eee8}
  .g-bar{position:absolute;border-radius:7px;cursor:pointer;overflow:hidden;box-shadow:0 3px 8px -3px rgba(0,0,0,.3)}
  .g-bar.proj{top:11px;height:24px}
  .g-bar.proj .fill{height:100%;border-radius:7px}
  .g-bar.proj .lab{position:absolute;inset:0;display:flex;align-items:center;padding:0 9px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .g-bar.task{top:9px;height:16px;border-radius:5px}
  .g-bar.task.todo{opacity:.42}.g-bar.task.late{background:var(--red)!important;opacity:1}
  .nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:5;pointer-events:none}
  .load-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:20px}
  .load-panel h3{font-size:15px;margin-bottom:14px}
  .load-row{display:flex;align-items:center;gap:14px;padding:8px 0}
  .load-row .lname{width:150px;flex-shrink:0;display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px}
  .load-track{flex:1;height:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;position:relative}
  .load-track i{display:block;height:100%;border-radius:8px;transition:.3s}
  .load-meta{width:160px;flex-shrink:0;text-align:right;font-size:12px;color:var(--txt-2)}
  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .person{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .person-h{padding:16px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .person-h .pa{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff}
  .person-h .pn{font-family:'Sora';font-weight:700;font-size:15px}

function suggestion(p){
  const prog=computeProg(p);
  if(p.bloqueado)return{tone:'bad',txt:'Marcado como bloqueado. Acione o respons\u00e1vel pela depend\u00eancia externa para destravar antes de seguir.'};
  if(prog>=100)return{tone:'ok',txt:'Todas as atividades conclu\u00eddas. Pode encerrar, arquivar e registrar o aprendizado no hist\u00f3rico.'};
  const dd=p.prazo?daysTo(p.prazo):null;const pl=plannedProg(p);
  const overdue=(p.tasks||[]).filter(t=>!t.done&&t.fim&&daysTo(t.fim)<0);
  if(dd!==null&&dd<0)return{tone:'bad',txt:`Entrega vencida h\u00e1 ${Math.abs(dd)} dia(s) com ${prog}% conclu\u00eddo. Renegocie o prazo ou replaneje as datas e priorize o que falta.`};
  if(overdue.length)return{tone:'bad',txt:`${overdue.length} atividade(s) passaram da data sem conclus\u00e3o (ex.: "${overdue[0].nome}"). Cobre o respons\u00e1vel ou ajuste o per\u00edodo.`};
  if(pl!==null&&prog<pl-10)return{tone:'warn',txt:`Avan\u00e7o real (${prog}%) abaixo do planejado (${pl}%). Acelere as pr\u00f3ximas atividades ou use "Reagendar pela entrega".`};
  if(dd!==null&&dd<=2)return{tone:'warn',txt:`Entrega ${dd<=0?'hoje':'em '+dd+' dia(s)'} com ${prog}%. Concentre o time nas atividades finais.`};
  return{tone:'ok',txt:'No ritmo. Siga o plano e mantenha o status atualizado no hist\u00f3rico.'};
}

  if(statusGroup==='urgencia'){const blk=(ti,it)=>it.length?`\n${ti}\n`+it.map(line).join(''):'';t+=blk('\ud83d\udd34 ATRASADOS \u2014 A\u00c7\u00c3O IMEDIATA',byS('atrasado'))+blk('\ud83d\udfe3 BLOQUEADOS \u2014 DESTRAVAR',byS('bloqueado'))+blk('\ud83d\udfe1 ATEN\u00c7\u00c3O',byS('atencao'))+blk('\ud83d\udfe2 NO PRAZO',byS('no_prazo'))+blk('\u2705 CONCLU\u00cdDOS NA SEMANA',concl);}
  else{DB.team.forEach(person=>{const m=person.nome;const it=all.filter(p=>p.resp===m&&(p.status!=='concluido'||(p.prazo&&daysTo(p.prazo)>=-7)));if(it.length)t+=`\n\u2014 ${m.toUpperCase()}${person.empresa?' ('+person.empresa+')':''} \u2014\n`+it.map(line).join('');});}
  return t.trim();
}

let _mentionOpen=false;

function setupMentionInput(){
  const inp=$('#f_log');const drop=$('#mentionDrop');
  if(!inp||!drop)return;
  inp.addEventListener('input',()=>{
    const val=inp.value,cur=inp.selectionStart||0;
    const before=val.slice(0,cur);
    const atIdx=before.lastIndexOf('@');
    if(atIdx>=0&&(atIdx===0||/\s/.test(before[atIdx-1]))){
      const q=before.slice(atIdx+1).toLowerCase();
      const opts=DB.team.filter(p=>p.nome.toLowerCase().includes(q)).slice(0,8);
      if(opts.length){
        _mentionOpen=true;
        drop.innerHTML=opts.map(p=>`<div class="mention-opt" data-nome="${esc(p.nome)}" onmousedown="event.preventDefault();insertMention('${esc(p.nome.replace(/\\/g,'\\\\').replace(/'/g,"\\'"))}')"><div class="avatar" style="background:${avColor(p.nome)};width:26px;height:26px;font-size:11px;border-radius:50%">${initials(p.nome)}</div><span>${esc(p.nome)}</span>${p.email?`<span style="font-size:11px;color:var(--txt-3);margin-left:auto">${esc(p.email)}</span>`:''}</div>`).join('');
        drop.classList.add('show');return;
      }
    }
    _mentionOpen=false;drop.classList.remove('show');
  });
  inp.addEventListener('keydown',e=>{
    if(!drop.classList.contains('show'))return;
    const opts=drop.querySelectorAll('.mention-opt');
    let cur=drop.querySelector('.mention-opt.active');
    if(e.key==='ArrowDown'){e.preventDefault();if(!cur){if(opts[0])opts[0].classList.add('active');}else{cur.classList.remove('active');const n=cur.nextElementSibling;if(n)n.classList.add('active');}}
    else if(e.key==='ArrowUp'){e.preventDefault();if(cur){cur.classList.remove('active');const p=cur.previousElementSibling;if(p)p.classList.add('active');}}
    else if(e.key==='Enter'&&cur){e.preventDefault();insertMention(cur.dataset.nome);}
    else if(e.key==='Escape'){_mentionOpen=false;drop.classList.remove('show');}
  });
  inp.addEventListener('blur',()=>{setTimeout(()=>{_mentionOpen=false;drop.classList.remove('show');},180);});
}
function insertMention(nome){
  const inp=$('#f_log');if(!inp)return;
  const val=inp.value,cur=inp.selectionStart||0;
  const before=val.slice(0,cur);
  const atIdx=before.lastIndexOf('@');
  if(atIdx<0)return;
  const after=val.slice(cur);
  const newVal=before.slice(0,atIdx)+'@'+nome+' '+after;
  inp.value=newVal;
  const pos=atIdx+nome.length+2;
  inp.focus();inp.setSelectionRange(pos,pos);
  const drop=$('#mentionDrop');if(drop)drop.classList.remove('show');
  _mentionOpen=false;
}
function extractMentions(txt){
  const matches=(txt||'').match(/@([\w\u00C0-\u00FF][^\s@,;.!?\u2014]*)/g)||[];
  const results=[];
  matches.forEach(m=>{
    const q=m.slice(1).trim();
    const found=DB.team.find(p=>p.nome.toLowerCase()===q.toLowerCase()||p.nome.toLowerCase().startsWith(q.toLowerCase()));
    if(found&&!results.includes(found.nome))results.push(found.nome);
  });
  return results;
}
async function sendMentionNotif(mentions,projetoNome,texto,autor){
  if(!useSb||!SB||!mentions.length)return;
  const emails=mentions.map(nome=>{const p=DB.team.find(x=>x.nome===nome);return p&&p.email?p.email:null;}).filter(Boolean);
  if(!emails.length){console.log('[mention] pessoas marcadas sem e-mail:',mentions);return;}
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/acesso',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},body:JSON.stringify({action:'mencionar',emails,projeto:projetoNome,texto,autor:autor||''})});
    const j=await r.json();
    if(j&&j.ok)toast('Notifica\u00e7\u00e3o enviada para '+mentions.join(', ')+' \u2713');
    else console.warn('[mention] resposta:',j);
  }catch(e){console.error('[mention] erro:',e);}
}

/* ===== ENVIAR STATUS POR E-MAIL ===== */
async function sendStatusEmail(){
  if(!useSb){toast('Dispon\u00edvel apenas com Supabase conectado.');return;}
  toast('Enviando status por e-mail...');
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/daily-status?force=1',{method:'POST',headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'}});
    const j=await r.json().catch(()=>({}));
    if(r.ok)toast('Status enviado por e-mail \u2713');
    else toast('Erro: '+((j&&(j.error||j.message))||'verifique a Edge Function daily-status'));
  }catch(e){console.error('[send-status]',e);toast('N\u00e3o foi poss\u00edvel chamar a Edge Function.');}
}

/* ===== AUTOR DO LOG (usuário logado) ===== */
function getLogAutor(){
  if(currentUser&&currentUser.email){
    const me=(DB.team||[]).find(p=>p.email&&p.email.toLowerCase()===(currentUser.email||'').toLowerCase());
    if(me)return me.nome;
    // fallback: parte antes do @ do e-mail
    return currentUser.email.split('@')[0];
  }
  return 'Equipe';
}

/* ===== PESSOAS ENVOLVIDAS NO PROJETO (via @mentions nos logs) ===== */
function renderPessoasEnvolvidas(logs){
  const wrap=$('#pessoasEnvolvidasWrap');const el=$('#envolvidos');
  if(!wrap||!el)return;
  const nomes=new Set();
  (logs||[]).forEach(l=>{
    const m=(l.txt||'').match(/@([\w\u00C0-\u00FF][^\s@,;.!?\u2014]*)/g)||[];
    m.forEach(match=>{
      const q=match.slice(1).trim();
      const found=DB.team.find(p=>p.nome.toLowerCase()===q.toLowerCase()||p.nome.toLowerCase().startsWith(q.toLowerCase()));
      if(found)nomes.add(found.nome);
    });
  });
  if(!nomes.size){wrap.style.display='none';return;}
  wrap.style.display='block';
  el.innerHTML=[...nomes].map(nome=>`<span class="env-chip"><span class="av-xs" style="background:${avColor(nome)}">${initials(nome)}</span>${esc(nome)}</span>`).join('');
}

/* ===== SUBATIVIDADES ===== */
function addSubAtv(parentId){
  const inp=$('#subInp_'+parentId);
  if(!inp||!inp.value.trim())return;
  const t=myActs.find(x=>x.id===parentId);if(!t)return;
  if(!t.subs)t.subs=[];
  t.subs.push({id:id(),titulo:inp.value.trim(),feito:false});
  inp.value='';
  saveMyActs();refreshActs();
}
function toggleSubAtv(parentId,subId){
  const t=myActs.find(x=>x.id===parentId);if(!t||!t.subs)return;
  const s=t.subs.find(x=>x.id===subId);if(!s)return;
  s.feito=!s.feito;saveMyActs();refreshActs();
}
function delSubAtv(parentId,subId){
  const t=myActs.find(x=>x.id===parentId);if(!t||!t.subs)return;
  t.subs=t.subs.filter(x=>x.id!==subId);saveMyActs();refreshActs();
}
